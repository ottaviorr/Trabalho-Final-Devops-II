apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: seu-usuario/financas-api:v1
          ports:
            - containerPort: 3000
          env:
            - name: MONGO_URL
              value: mongodb://mongo:27017
          # Só recebe tráfego quando estiver respondendo
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
          # Espera o Service parar de mandar tráfego antes de desligar o pod
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
---
# ClusterIP: acessível apenas de dentro do cluster
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
